opencollection: 1.0.0

info:
  name: hka-v1
config:
  proxy:
    inherit: true
    config:
      protocol: http
      hostname: ""
      port: ""
      auth:
        username: ""
        password: ""
      bypassProxy: ""

request:
  variables:
    - name: baseUrl
      value: https://localhost:8443
    - name: baseUrl
      value: http://localhost:8080
      disabled: true
    - name: baseUrl
      value: http://localhost
      disabled: true
    - name: baseUrl
      value: https://localhost
      disabled: true
bundled: false
extensions:
  ignore:
    - node_modules
    - .git


