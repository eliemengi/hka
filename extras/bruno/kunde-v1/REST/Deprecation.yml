info:
  name: Deprecation
  type: http
  seq: 6

http:
  method: GET
  url: "{{apiUrl}}/deprecated"
  headers:
    - name: X-Version
      value: 0.0.1
  auth: inherit

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "200"
    - expression: res.body.deprecated
      operator: isString

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5


