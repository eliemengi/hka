info:
  name: Alle
  type: http
  seq: 1

http:
  method: GET
  url: "{{apiUrl}}"
  headers:
    - name: Accept
      value: application/json
    - name: X-Version
      value: 1.0.0
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        // https://www.chaijs.com/api/bdd

        test('ID', () => {
          res.getBody()
            .map(kunde => kunde.id)
            .forEach(id => expect(id).to.be.a('string').that.matches(/[\da-f]{8}-[\da-f]{4}-[\da-f]{4}-[\da-f]{4}-[\da-f]{12}/u));
        });
  assertions:
    - expression: res.status
      operator: eq
      value: "200"
    - expression: res.headers['content-type']
      operator: eq
      value: application/json
    - expression: res.body
      operator: isArray
    - expression: res.body
      operator: isNotEmpty

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5


