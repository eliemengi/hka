info:
  name: Suche mit einem Interesse
  type: http
  seq: 7

http:
  method: GET
  url: "{{apiUrl}}?interesse=L"
  headers:
    - name: Accept
      value: application/json
    - name: X-Version
      value: 1.0.0
  params:
    - name: interesse
      value: L
      type: query
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        test('Body: Nachname enthaelt "i" und ID', () => {
          res.getBody()
            .forEach(kunde => {
              const { interessen, id } = kunde;
              expect(interessen).to.be.an('array').that.includes('L');
              expect(id).to.be.a('string').that.matches(/[\da-f]{8}-[\da-f]{4}-[\da-f]{4}-[\da-f]{4}-[\da-f]{12}$/u);
            });
        });
  assertions:
    - expression: res.status
      operator: eq
      value: "200"
    - expression: res.headers['content-type']
      operator: eq
      value: application/json
    - expression: res.body
      operator: isArray
    - expression: res.body
      operator: isNotEmpty

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5


