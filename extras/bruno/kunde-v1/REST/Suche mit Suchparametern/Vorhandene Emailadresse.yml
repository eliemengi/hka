info:
  name: Vorhandene Emailadresse
  type: http
  seq: 5

http:
  method: GET
  url: "{{apiUrl}}?email=admin@acme.com"
  headers:
    - name: Accept
      value: application/json
    - name: X-Version
      value: 1.0.0
  params:
    - name: email
      value: admin@acme.com
      type: query
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        test('Body: Email und ID', () => {
          const { email, id } = res.getBody()[0];
          expect(email).to.be.equal('admin@acme.com');
          expect(id).to.be.a('string').that.matches(/[\da-f]{8}-[\da-f]{4}-[\da-f]{4}-[\da-f]{4}-[\da-f]{12}$/u);
        });
  assertions:
    - expression: res.status
      operator: eq
      value: "200"
    - expression: res.headers['content-type']
      operator: eq
      value: application/json
    - expression: res.body
      operator: isArray
    - expression: res.body
      operator: length
      value: "1"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5


