info:
  name: Nachnamen mit Präfix
  type: http
  seq: 10

http:
  method: GET
  url: "{{apiUrl}}/nachname/:praefix"
  headers:
    - name: Accept
      value: application/json
    - name: X-Version
      value: 1.0.0
  params:
    - name: praefix
      value: A
      type: path
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |-
        test('Body: Nachname enthaelt \"A\"', () => {
          res.getBody()
            .nachnamen
            .forEach(nachname => expect(nachname).to.be.a('string').that.includes('A'));
        });
  assertions:
    - expression: res.status
      operator: eq
      value: "200"
    - expression: res.headers['content-type']
      operator: eq
      value: application/json
    - expression: res.body.nachnamen
      operator: isArray
    - expression: res.body.nachnamen
      operator: isNotEmpty

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5


