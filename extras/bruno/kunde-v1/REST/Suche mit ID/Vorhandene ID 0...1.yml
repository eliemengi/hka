info:
  name: Vorhandene ID 0...1
  type: http
  seq: 1

http:
  method: GET
  url: "{{apiUrl}}/:id"
  headers:
    - name: Accept
      value: application/json
    - name: X-Version
      value: 1.0.0
  params:
    - name: id
      value: 00000001-0000-7000-9000-000000000000
      type: path
  auth: inherit

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "200"
    - expression: res.headers['content-type']
      operator: eq
      value: application/json
    - expression: res.body.id
      operator: eq
      value: 00000001-0000-7000-9000-000000000000

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5


