info:
  name: hka 30 mit ungültigen Daten ändern
  type: http
  seq: 3

http:
  method: PUT
  url: "{{apiUrl}}/:id"
  headers:
    - name: If-Match
      value: '"0"'
    - name: X-Version
      value: 1.0.0
  params:
    - name: id
      value: 00000030-0000-7000-9000-000000000000
      type: path
  body:
    type: json
    data: |
      {
          "nachname": "?!%",
          "email": "email",
          "kategorie" : 11,
          "hasNewsletter": true,
          "geburtsdatum": "3000-01-31",
          "homepage": "https://www.test.de",
          "geschlecht": "W",
          "familienstand": "L",
          "username": "invalid"
      }
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        test('Problem Details', () => {
            const { detail } = res.getBody();
            const props = ['nachname', 'email', 'kategorie', 'geburtsdatum'];
            props.forEach(prop => expect(detail).to.include(prop));
        });
  assertions:
    - expression: res.status
      operator: eq
      value: "422"
    - expression: res.headers['content-type']
      operator: eq
      value: application/problem+json
    - expression: res.body.status
      operator: eq
      value: "422"
    - expression: res.body.title
      operator: eq
      value: Unprocessable Content
    - expression: res.body.instance
      operator: matches
      value: /api/00000030-0000-7000-9000-000000000000$
    - expression: res.body.detail
      operator: isString

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5


