info:
  name: hka 30 ändern und Email existiert
  type: http
  seq: 4

http:
  method: PUT
  url: "{{apiUrl}}/:id"
  headers:
    - name: If-Match
      value: '"1"'
    - name: X-Version
      value: 1.0.0
  params:
    - name: id
      value: 00000030-0000-7000-9000-000000000000
      type: path
  body:
    type: json
    data: |
      {
        "nachname": "Testput",
        "email": "admin@acme.com",
        "kategorie" : 1,
        "hasNewsletter": true,
        "geburtsdatum": "2024-01-31",
        "homepage": "https://www.test.de",
        "geschlecht": "W",
        "familienstand": "L",
        "username": "alpha3"
      }
  auth: inherit

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "422"
    - expression: res.headers['content-type']
      operator: eq
      value: application/problem+json
    - expression: res.body.status
      operator: eq
      value: "422"
    - expression: res.body.title
      operator: eq
      value: Unprocessable Content
    - expression: res.body.detail
      operator: contains
      value: Emailadresse
    - expression: res.body.instance
      operator: matches
      value: /api/00000030-0000-7000-9000-000000000000$

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5


