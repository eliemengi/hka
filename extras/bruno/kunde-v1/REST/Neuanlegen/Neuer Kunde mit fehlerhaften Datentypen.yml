info:
  name: Neuer Kunde mit fehlerhaften Datentypen
  type: http
  seq: 6

http:
  method: POST
  url: "{{apiUrl}}"
  headers:
    - name: X-Version
      value: 1.0.0
  body:
    type: json
    data: |-
      {
          "nachname": "Test",
          "email": "Theo@Test.de",
          "kategorie" : 1,
          "hasNewsletter": true,
          "geburtsdatum": "123",
          "homepage": "123!",
          "geschlecht": "W",
          "familienstand": "L",
          "adresse": {
              "plz": 12345,
              "ort": "Testort"
          },
          "rechnungen": [{
              "betrag": 0,
              "waehrung": "Xy"
          }],
          "interessen": [
              "R",
              "L"
          ]
      }
  auth: inherit

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "400"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5


