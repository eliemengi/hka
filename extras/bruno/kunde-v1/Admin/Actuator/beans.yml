info:
  name: beans
  type: http
  seq: 2

http:
  method: GET
  url: "{{actuatorUrl}}/beans"
  auth: inherit

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "200"
    - expression: res.body.contexts.kunde.beans
      operator: isJson
    - expression: res.body.contexts.kunde.beans
      operator: isNotEmpty

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5


