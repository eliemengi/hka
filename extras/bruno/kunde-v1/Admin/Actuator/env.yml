info:
  name: env
  type: http
  seq: 3

http:
  method: GET
  url: "{{actuatorUrl}}/env"
  auth: inherit

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "200"
    - expression: res.body.activeProfiles
      operator: isDefined
    - expression: res.body.activeProfiles
      operator: isArray
    - expression: res.body.activeProfiles
      operator: isNotEmpty
    - expression: res.body.propertySources
      operator: isDefined
    - expression: res.body.propertySources
      operator: isArray
    - expression: res.body.propertySources
      operator: isNotEmpty

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5


