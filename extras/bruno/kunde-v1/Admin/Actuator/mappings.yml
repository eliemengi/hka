info:
  name: mappings
  type: http
  seq: 5

http:
  method: GET
  url: "{{actuatorUrl}}/mappings"
  auth: inherit

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "200"
    - expression: res.body.contexts.kunde.mappings.dispatcherServlets.dispatcherServlet
      operator: isDefined
    - expression: res.body.contexts.kunde.mappings.dispatcherServlets.dispatcherServlet
      operator: isArray
    - expression: res.body.contexts.kunde.mappings.dispatcherServlets.dispatcherServlet
      operator: isNotEmpty

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5


