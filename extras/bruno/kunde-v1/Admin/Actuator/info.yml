info:
  name: info
  type: http
  seq: 4

http:
  method: GET
  url: "{{actuatorUrl}}/info"
  auth: inherit

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "200"
    - expression: res.body.os
      operator: isJson
    - expression: res.body.os
      operator: isNotEmpty

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5


