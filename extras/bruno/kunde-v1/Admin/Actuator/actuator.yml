info:
  name: actuator
  type: http
  seq: 1

http:
  method: GET
  url: "{{actuatorUrl}}"
  auth: inherit

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "200"
    - expression: res.body._links
      operator: isJson
    - expression: res.body._links
      operator: isNotEmpty

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5


