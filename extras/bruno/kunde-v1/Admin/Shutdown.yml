info:
  name: Shutdown
  type: http
  seq: 3

http:
  method: POST
  url: "{{actuatorUrl}}/shutdown"
  auth: inherit

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "200"
    - expression: res.body.message
      operator: matches
      value: ^Shutting down

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5


