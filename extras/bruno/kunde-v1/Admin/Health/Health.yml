info:
  name: Health
  type: http
  seq: 1

http:
  method: GET
  url: "{{healthUrl}}"
  auth: inherit

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "200"
    - expression: res.body.status
      operator: eq
      value: UP
    - expression: res.body.components.diskSpace.status
      operator: eq
      value: UP
    - expression: res.body.components.livenessState.status
      operator: eq
      value: UP
    - expression: res.body.components.readinessState.status
      operator: eq
      value: UP

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5


