info:
  name: Readiness
  type: http
  seq: 3

http:
  method: GET
  url: "{{healthUrl}}/readiness"
  auth: inherit

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "200"
    - expression: res.body.status
      operator: eq
      value: UP

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5


